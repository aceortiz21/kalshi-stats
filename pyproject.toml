[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-btc-stats"
version = "0.1.0"
description = "Scenario-based statistics engine for Kalshi 15-minute BTC markets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kalshi-stats = "kalshi_stats.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
